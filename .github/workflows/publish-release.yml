name: Publish Alpha Jump Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-manifest/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify merged manifest entry and publish draft
        run: |
          tag="${HEAD_REF#release-manifest/}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unexpected release-manifest branch: $HEAD_REF" >&2
            exit 1
          fi
          version="${tag#v}"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/alpha-jump_${version}.zip"
          jq -e --arg version "$version" --arg source_url "$source_url" \
            '.[0].versions[] | select(.version == $version and .sourceUrl == $source_url and (.checksum | type == "string") and (.checksum | length > 0))' \
            manifest.json >/dev/null
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true"
          gh release edit "$tag" --draft=false
